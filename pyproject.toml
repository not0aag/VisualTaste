[project]
name = "visualtaste"
version = "0.1.0"
description = "A local, single-user image recommendation engine that learns one person's visual taste."
requires-python = ">=3.12,<3.13"
# Dependencies are installed with `uv pip install` (see README) and pinned in
# requirements.lock. They are listed here for documentation, but note that torch
# MUST come from the CUDA index -- a plain resolve would pull the CPU build.
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch",
    "timm",
    "transformers",
    "huggingface_hub",
    "faiss-cpu",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pillow",
    "imagehash",
    "scikit-learn",
    "umap-learn",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "boto3",
    "tqdm",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "jupyter", "nbconvert", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/visualtaste"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib, never os.path -- a project rule (brief section 5)
    "RUF",
]
ignore = [
    # The maths code is named after the maths: `w`, `b`, `p`, `X`, `Sigma`, `L`.
    # Short and capitalised names are deliberate and documented in docstrings.
    "E741",
    "N803",
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["visualtaste"]

[tool.ruff.lint.per-file-ignores]
# README figure scripts print typographic × and – into chart text on purpose.
"scripts/readme_*.py" = ["RUF001"]
# Tests assert hand-worked numbers; magic values are the point.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:visualtaste.*"]
# Keep only failed runs' temp folders, and only the latest one. The default
# kept three full runs, which once grew to 25 GB of database copies.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "gpu: needs a CUDA device; skipped in CI and on machines without one",
]
