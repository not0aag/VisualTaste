<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="VisualTaste: a local image recommender that learns your visual taste from swipes">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.12" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#3fd8f0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fd8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.65">
      <stop offset="0" stop-color="#a594f9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a594f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd8f0"/>
      <stop offset="1" stop-color="#a594f9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#3fd8f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fd8f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fd8f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#05080d"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowA)"/>
  <rect width="1280" height="400" fill="url(#glowB)"/>

  <!-- Viewfinder brackets -->
  <g fill="none" stroke="#3fd8f0" stroke-width="2.5" stroke-opacity="0.85">
    <path d="M60 92V60h32"/>
    <path d="M1188 60h32v32"/>
    <path d="M1220 308v32h-32"/>
    <path d="M92 340H60v-32"/>
  </g>

  <!-- Logo: an eye inside a hexagon -->
  <g transform="translate(128 132) scale(4.2)">
    <g filter="url(#soft)" opacity="0.7">
      <path d="M16 2 28 9v14l-12 7L4 23V9z" fill="none" stroke="#3fd8f0" stroke-width="1.8"/>
    </g>
    <path d="M16 2 28 9v14l-12 7L4 23V9z" fill="none" stroke="url(#mark)" stroke-width="1.8"/>
    <path d="M8 16s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z" fill="none" stroke="url(#mark)" stroke-width="1.6"/>
    <circle cx="16" cy="16" r="2.4" fill="#3fd8f0"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="10" fill="#ffffff">VISUAL<tspan fill="#3fd8f0">TASTE</tspan></text>
  <rect x="302" y="216" width="640" height="1.5" fill="url(#rule)"/>
  <text x="302" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#c9d5e3">A local image recommender that learns your visual taste from swipes.</text>

  <!-- Readouts -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="2.5" fill="#7b8ca5">
    <text x="302" y="300">50,000 IMAGES · SIGLIP 2 + DINOV2 · R0 → R6 · 100% ON-DEVICE</text>
  </g>

  <!-- A score meter, as on the Feed -->
  <g transform="translate(1000 296)">
    <text x="0" y="4" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2" fill="#7b8ca5">SCORE</text>
    <rect x="62" y="-3" width="96" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="62" y="-3" width="88" height="5" rx="2.5" fill="url(#mark)"/>
    <text x="168" y="4" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2eaf3">0.94</text>
  </g>

  <!-- Palette swatches, as under each photo -->
  <g transform="translate(1000 140)">
    <rect width="22" height="22" rx="3" fill="#3fd8f0"/>
    <rect x="30" width="22" height="22" rx="3" fill="#a594f9"/>
    <rect x="60" width="22" height="22" rx="3" fill="#3ddc97"/>
    <rect x="90" width="22" height="22" rx="3" fill="#ffc145"/>
    <rect x="120" width="22" height="22" rx="3" fill="#ff6b81"/>
    <text x="0" y="48" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2" fill="#7b8ca5">DOMINANT PALETTE</text>
  </g>
</svg>
